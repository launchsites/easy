name: easy
description: "A local workspace for your calendar, tasks and notes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Geist.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
