name: Apple SDK check

on:
  workflow_dispatch:
    inputs:
      ios_simulator_smoke:
        description: Launch Easy on an iPhone simulator and capture first-run setup
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  apple:
    runs-on: ${{ inputs.ios_simulator_smoke && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the checkout and Apple SDKs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uname -m
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk macosx --show-sdk-version

      - name: Install pinned Flutter
        run: bash .github/scripts/bootstrap-flutter.sh

      - name: Restore locked Dart dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug --no-codesign --no-pub

      - name: Build unsigned macOS release
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
        run: flutter build macos --release --no-pub

      - name: Verify iPhone simulator first launch
        if: ${{ inputs.ios_simulator_smoke }}
        timeout-minutes: 15
        run: |
          python3 tool/benchmark/ios_simulator_smoke.py \
            build/ios/iphonesimulator/Runner.app \
            "$RUNNER_TEMP/easy-ios-simulator-smoke/setup.png"

      - name: Upload the first-run screenshot
        if: ${{ inputs.ios_simulator_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easy-iphone-setup
          path: ${{ runner.temp }}/easy-ios-simulator-smoke/setup.png
          if-no-files-found: error
          retention-days: 7
