name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install pinned Flutter
        run: bash .github/scripts/bootstrap-flutter.sh

      - name: Restore locked Dart dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Verify native project declarations
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Run the Dart test suite
        env:
          TZ: Europe/London
        run: flutter test --no-pub --concurrency=2

      - name: Check daylight-saving transitions
        run: |
          TZ=America/New_York flutter test --no-pub --concurrency=2 \
            test/capture_text_test.dart test/calendar_page_test.dart \
            test/calendar_record_editor_test.dart test/workspace_calendar_persistence_test.dart \
            test/review_test.dart
          TZ=Australia/Lord_Howe flutter test --no-pub --concurrency=2 \
            test/capture_text_test.dart test/calendar_page_test.dart

      - name: Compile the Linux release
        run: flutter build linux --release --no-pub

      - name: Archive the Linux review package
        if: github.event_name != 'pull_request'
        run: |
          stage="$RUNNER_TEMP/easy-linux-review"
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/easy"
          mkdir -p "$stage"
          cp -a "$bundle" "$stage/easy"
          {
            printf 'Easy Linux x86-64 review package\n'
            printf 'Source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'From the extracted easy directory, run ./easy.\n'
            printf 'GTK 3, libsecret, and GStreamer 1.x are required at runtime.\n'
          } > "$stage/easy/BUILD.txt"
          tar -czf "$stage/easy-linux-x64.tar.gz" -C "$stage" easy
          mkdir "$stage/extracted"
          tar -xzf "$stage/easy-linux-x64.tar.gz" -C "$stage/extracted"
          test -x "$stage/extracted/easy/easy"
          (
            cd "$stage"
            sha256sum easy-linux-x64.tar.gz > SHA256SUMS
          )

      - name: Retain the Linux review package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easy-linux-x64
          path: |
            ${{ runner.temp }}/easy-linux-review/easy-linux-x64.tar.gz
            ${{ runner.temp }}/easy-linux-review/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
